services:
  weight-log:
    build: .
    container_name: weight-log
    restart: unless-stopped
    volumes:
      - weight-log-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/data/weight-log.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/config/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  weight-log-data:
    driver: local
