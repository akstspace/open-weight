name: Moss
metadata:
  description: Forest green and muted earth product UI.
  version: 1.0.0
modes:
  light:
    palette:
      primary: "#1B2A22"
      secondary: "#5D6E5F"
      tertiary: "#3E7C50"
      neutral: "#F1F2EC"
      text: "#1B2A22"
    semantic:
      background: "#ffffff"
      foreground: "#1B2A22"
      muted: "#a7b0a6"
      mutedForeground: "#5D6E5F"
      border: "#ccd1c9"
      input: "#c5cac2"
      ring: "#3E7C50"
      brand:
        background: "#1B2A22"
        foreground: "#f5f5f5"
      accent:
        background: "#3E7C50"
        foreground: "#f5f5f5"
      surface:
        default: "#F1F2EC"
        elevated: "#ffffff"
        overlay: rgba(0,0,0,0.4)
      feedback:
        success: "#16a34a"
        warning: "#d97706"
        error: "#dc2626"
        info: "#2563eb"
  dark:
    palette:
      primary: "#F1F2EC"
      secondary: "#8FA092"
      tertiary: "#6FAE82"
      neutral: "#0F1A14"
      text: "#F1F2EC"
    semantic:
      background: "#0F1A14"
      foreground: "#F1F2EC"
      muted: "#2f3c34"
      mutedForeground: "#8FA092"
      border: "#3c4940"
      input: "#425046"
      ring: "#6FAE82"
      brand:
        background: "#F1F2EC"
        foreground: "#171717"
      accent:
        background: "#6FAE82"
        foreground: "#f5f5f5"
      surface:
        default: "#1d2822"
        elevated: "#27312c"
        overlay: rgba(0,0,0,0.7)
      feedback:
        success: "#22c55e"
        warning: "#f59e0b"
        error: "#ef4444"
        info: "#3b82f6"
typography:
  fonts:
    heading: Public Sans
    body: Public Sans
    mono: IBM Plex Mono
  scale:
    h1:
      fontFamily: Public Sans
      fontSize: 3rem
      fontWeight: "800"
      lineHeight: "1.05"
    h2:
      fontFamily: Public Sans
      fontSize: 2rem
      fontWeight: "700"
      lineHeight: "1.15"
    body-md:
      fontFamily: Public Sans
      fontSize: 1rem
      fontWeight: "400"
      lineHeight: "1.6"
    label-caps:
      fontFamily: IBM Plex Mono
      fontSize: 0.75rem
      fontWeight: "600"
      letterSpacing: 0.12em
      textTransform: uppercase
radius:
  none: 0px
  sm: 4px
  md: 8px
  lg: 12px
  xl: 16px
  full: 9999px
spacing:
  xs: 4px
  sm: 8px
  md: 16px
  lg: 24px
  xl: 32px
shadow:
  sm: 0 1px 2px 0 rgb(0 0 0 / 0.05)
  md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)
  lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)
